<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#E40000">
<title>No internet · Accel Business</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#F6F6F7;color:#1F1F1F;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px;box-sizing:border-box}
  .card{background:#fff;border-radius:20px;padding:32px 24px;max-width:360px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
  h1{font-size:24px;margin:16px 0 8px} p{color:#5F6368;font-size:17px;line-height:1.5;margin:0 0 6px}
  button{margin-top:20px;height:56px;width:100%;border:0;border-radius:999px;background:#E40000;color:#fff;font-size:18px;font-weight:600}
</style>
</head>
<body><div class="card">
  <img src="/icons/icon-192.png" width="64" height="64" alt="">
  <h1>No internet connection</h1>
  <p>Please check your mobile data or Wi-Fi.</p>
  <p lang="hi">कृपया अपना मोबाइल डेटा या Wi-Fi जाँचें।</p>
  <button onclick="location.reload()">Try again · फिर कोशिश करें</button>
</div></body>
</html>
